name: Build Android App (APK)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          npm install -g cordova
          cordova create worker_app com.branchprep.worker "BranchPrep Worker"
          
          # نسخ ملفات الموقع
          cp -r index.html worker_app/www/ 2>/dev/null || true
          cp -r *.html *.js *.css worker_app/www/ 2>/dev/null || true
          cp -r *.png worker_app/www/ 2>/dev/null || true
          
          cd worker_app
          
          # إعدادات إلغاء شاشة السلاش من config.xml
          sed -i '/<\/widget>/i \    <preference name="ShowSplashScreen" value="false" />\n    <preference name="SplashScreenDelay" value="0" />\n    <preference name="FadeSplashScreen" value="false" />' config.xml
          
          cordova platform add android
          
          # 1. تثبيت الأيقونة الخارجية (icon-192.png) بشكل صحيح بدون المساس بإعدادات XML
          if [ -f www/icon-192.png ]; then
            find platforms/android/ -name "ic_launcher*.png" -exec cp www/icon-192.png {} \;
          fi

          # 2. حذف ملفات الروبوت الرمادي XML تماماً حتى لا يجدها النظام عند الفتح
          find platforms/android/ -name "ic_cdv_splashscreen.xml" -delete 2>/dev/null || true
          find platforms/android/ -name "ic_cdv_splashscreen.png" -delete 2>/dev/null || true

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-Android-APK
          path: worker_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

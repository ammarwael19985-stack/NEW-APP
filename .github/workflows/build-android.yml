name: Build Android App (APK)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          npm install -g cordova
          cordova create worker_app com.branchprep.worker "BranchPrep Worker"
          
          # نسخ كل ملفات الموقع
          cp -r index.html worker_app/www/ 2>/dev/null || true
          cp -r *.html *.js *.css worker_app/www/ 2>/dev/null || true
          cp -r *.png worker_app/www/ 2>/dev/null || true
          
          cd worker_app
          
          # 1. إعدادات الأيقونة والشاشة الأولى (Android Splash) باستخدام my-logo.png
          sed -i '/<\/widget>/i \    <icon src="www/icon-192.png" />\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/my-logo.png" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#1f6f5c" />\n    <preference name="SplashScreenDelay" value="0" />' config.xml
          
          cordova platform add android
          
          # 2. استبدال الأيقونة الخارجية بـ icon-192.png
          if [ -f www/icon-192.png ]; then
            find platforms/android/ -name "ic_launcher*.png" -exec cp www/icon-192.png {} \;
          fi

          # 3. استبدال الدخلة الأولى (شاشة النظام) بـ my-logo.png
          if [ -f www/my-logo.png ]; then
            find platforms/android/ -name "ic_cdv_splashscreen*.png" -exec cp www/my-logo.png {} \;
            find platforms/android/ -name "splash*.png" -exec cp www/my-logo.png {} \;
          fi

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-Android-APK
          path: worker_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

Name: Build Android App (APK)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          npm install -g cordova
          cordova create worker_app com.branchprep.worker "BranchPrep Worker"
          
          cp -r index.html worker_app/www/ 2>/dev/null || true
          cp -r *.html *.js *.css worker_app/www/ 2>/dev/null || true
          cp -r *.png worker_app/www/ 2>/dev/null || true
          
          cd worker_app
          
          # 1. إعدادات config.xml للأيقونة واللون الأخضر
          sed -i '/<\/widget>/i \    <icon src="www/icon-192.png" />\n    <preference name="ShowSplashScreen" value="false" />\n    <preference name="SplashScreen" value="none" />\n    <preference name="SplashScreenDelay" value="0" />\n    <preference name="ShowSplashScreenSpinner" value="false" />\n    <preference name="BackgroundColor" value="0xff1f6f5c" />' config.xml
          
          cordova platform add android
          
          # 2. استبدال أيقونات النظام الخارجية بـ icon-192.png
          if [ -f www/icon-192.png ]; then
            find platforms/android/ -name "ic_launcher*.png" -exec cp www/icon-192.png {} \;
          fi
          
          # 3. إخفاء شاشة الأندرويد الرمادية واستبدالها بالأيقونة واللون الأخضر
          GREEN_COLOR="#1f6f5c"
          
          # تعديل ألوان الشاشة المبدئية
          find platforms/android/app/src/main/res -name "cdv_colors.xml" -exec sed -i "s|<color name=\"cdv_background_color\">.*</color>|<color name=\"cdv_background_color\">${GREEN_COLOR}</color>|" {} \; 2>/dev/null || true
          
          # تحويل شعار النظام المبدئي من الروبوت الرمادي لأيقونتك الخضراء مباشرة
          find platforms/android/app/src/main/res -name "cdv_themes.xml" -exec sed -i 's|@drawable/ic_cdv_splashscreen|@mipmap/ic_launcher|g' {} \; 2>/dev/null || true
          find platforms/android/app/src/main/res -name "cdv_themes.xml" -exec sed -i 's|windowSplashScreenAnimationDuration">200|windowSplashScreenAnimationDuration">0|g' {} \; 2>/dev/null || true
          
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-Android-APK
          path: worker_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

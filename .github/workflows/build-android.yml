name: Build Android App (APK)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          npm install -g cordova
          cordova create worker_app com.branchprep.worker "BranchPrep Worker"
          cp -r index.html worker_app/www/ 2>/dev/null || true
          cp -r *.html *.js *.css worker_app/www/ 2>/dev/null || true
          cp -r *.png worker_app/www/ 2>/dev/null || true
          
          cd worker_app
          
          # إضافة إعدادات إلغاء شاشة كوردوفا الافتراضية
          sed -i '/<\/widget>/i \    <preference name="SplashScreen" value="none" />\n    <preference name="SplashScreenDelay" value="0" />' config.xml
          
          cordova platform add android
          
          # 1. استبدال أيقونة التطبيق الخارجية (icon-192.png)
          if [ -f www/icon-192.png ]; then
            find platforms/android/app/src/main/res/ -name "ic_launcher*.png" -exec cp www/icon-192.png {} \;
          fi

          # 2. استبدال جميع صور وشاشات الترحيب واللوجو بالكامل بـ (icon-512.png)
          if [ -f www/icon-512.png ]; then
            find platforms/android/app/src/main/res/ -name "*.png" ! -name "ic_launcher*" -exec cp www/icon-512.png {} \;
          fi

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-Android-APK
          path: worker_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

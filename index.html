<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BranchPrep Cloud - تحضير سحابي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9502f">
<style>
  :root{
    --ink:#12181f; --paper:#f5f3ee; --panel:#ffffff; --line:#dcd6c9;
    --accent:#1f6f5c; --accent-dark:#154d40; --warn:#b3452b; --muted:#6b6459;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Tahoma','Segoe UI',sans-serif;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 20px;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  header h1{font-size:1.15rem;margin:0;font-weight:800;}
  header .tag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:20px;}
  
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px;}
  .card h2{margin:0 0 10px;font-size:1.1rem;}
  .card p{color:var(--muted);font-size:.85rem;margin:0 0 20px;}
  
  .btn{display:inline-block;background:var(--accent);color:#fff;padding:14px 24px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;border:none;width:100%;text-align:center;}
  .btn:active{background:var(--accent-dark);}
  
  .input-group{margin-bottom:16px;text-align:right;}
  .input-group label{display:block;font-size:.85rem;margin-bottom:6px;color:var(--muted);}
  .input-group input{width:100%;padding:12px 14px;font-size:1.1rem;border-radius:8px;border:1px solid var(--line);background:#faf8f2;}
  .input-group input:focus{outline:2px solid var(--accent);}
  
  .hidden{display:none !important;}
  
  .status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.78rem;color:var(--muted);}
  .status-bar b{color:var(--ink);}
  
  .scan-box{background:var(--ink);border-radius:14px;padding:20px;margin-bottom:18px;}
  .scan-box label{color:#c9c2b3;font-size:.8rem;display:block;margin-bottom:8px;}
  .scan-box input{width:100%;padding:16px 14px;font-size:1.3rem;border-radius:10px;border:none;text-align:center;font-weight:700;}
  .scan-box input:focus{outline:3px solid var(--accent);}
  
  .result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .result .pname{font-size:1.15rem;font-weight:800;margin-bottom:12px;}
  
  .branch-table{width:100%;border-collapse:collapse;}
  .branch-table tr{border-bottom:1px solid var(--line);}
  .branch-table td{padding:12px 4px;font-size:1rem;}
  .branch-table td.qty{text-align:left;font-weight:800;font-size:1.25rem;color:var(--accent-dark);}
  .branch-table td.actual{width:78px;}
  .actual-input{width:100%;padding:8px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:1rem;font-weight:700;background:#faf8f2;}
  .fill-btn{background:#faf8f2;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;color:var(--accent-dark);}
  .fill-btn:active{background:var(--accent);color:#fff;}
  tr.branch-done td{color:#9a9488;}
  tr.branch-done td.qty{text-decoration:line-through;}
  
  .lock-banner{background:#fbeae5;border:2px solid var(--warn);color:var(--warn);padding:14px;border-radius:12px;font-size:.95rem;font-weight:bold;text-align:center;margin-bottom:16px;}
  .error-msg{background:#fbeae5;border:1px solid #e3b6a6;color:var(--warn);padding:12px;border-radius:10px;font-size:.85rem;margin-top:10px;}
  
  #loader{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(245,243,238,0.9);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
  @keyframes spin { 100% { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loader" class="hidden">
  <div class="spinner"></div>
  <h3 id="loaderText">جاري الاتصال بالسحابة...</h3>
</div>

<div class="wrap" id="appWrap">
  <header>
    <h1>BranchPrep <span style="background:var(--accent);color:#fff;font-size:.62rem;padding:2px 8px;border-radius:10px;vertical-align:middle;">سحابي ☁️</span></h1>
    <span class="tag" id="statusTag">تسجيل الدخول</span>
  </header>

  <!-- شاشة تسجيل دخول العامل -->
  <div id="loginScreen">
    <div class="card">
      <div style="font-size:3rem;margin-bottom:10px;">👷‍♂️</div>
      <h2>دخول عمال التحضير</h2>
      <p>أدخل اسمك وكود الطلبية المولد من Google Sheets للبدء</p>
      
      <div class="input-group">
        <label>اسم العامل:</label>
        <input type="text" id="workerNameInput" placeholder="مثال: عمار" />
      </div>
      <div class="input-group">
        <label>كود الطلبية (4 أرقام):</label>
        <input type="number" id="orderCodeInput" placeholder="مثال: 2600" inputmode="numeric" />
      </div>
      
      <button class="btn" onclick="loginWorker()">دخول لبدء التحضير 🚀</button>
      <div class="error-msg hidden" id="loginError"></div>
    </div>
  </div>

  <!-- شاشة التحضير والمسح -->
  <div id="scanScreen" class="hidden">
    <div class="status-bar">
      <span>المحضر: <b id="lblWorker"></b> | كود الطلبية: <b id="lblCode"></b></span>
      <button onclick="leaveOrder()" style="background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--warn);cursor:pointer;">خروج</button>
    </div>

    <div class="scan-box">
      <label>امسح باركود المنتج الآن</label>
      <form id="scanForm">
        <input type="text" id="barcodeInput" inputmode="none" placeholder="اضرب الباركود هنا" autocomplete="off" />
      </form>
    </div>

    <div id="lockAlert" class="lock-banner hidden">
      🛑 تنبيه: هذا المنتج يقوم بتحضيره الآن العامل: <span id="lockWorkerName"></span> (مغلق مؤقتاً)
    </div>

    <div id="resultBox" class="result hidden"></div>
    
    <div id="placeholder" style="text-align:center;color:var(--muted);padding:30px 20px;">امسح باركود أي صنف لتظهر لك كميات الفروع المطلوبة</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwkFDchLHEM7eeiluBR4J2luERZnmttgpF6iFsi0kFYAPBUdArv_R2vXj3eye63upDYPw/exec';

let currentUser = localStorage.getItem('branchprep_worker') || '';
let currentOrderCode = localStorage.getItem('branchprep_ordercode') || '';
let currentOrderData = null;
let currentScannedBarcode = null;

document.getElementById('workerNameInput').value = currentUser;

function showLoader(text) {
  document.getElementById('loaderText').textContent = text;
  document.getElementById('loader').classList.remove('hidden');
}

function hideLoader() {
  document.getElementById('loader').classList.add('hidden');
}

async function apiCall(action, payload) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, ...payload })
    });
    return await response.json();
  } catch (err) {
    return { success: false, message: 'فشل الاتصال بالإنترنت!' };
  }
}

// فحص الجلسة السابقة تلقائياً عند تحميل الصفحة/الريفرش
window.addEventListener('DOMContentLoaded', async () => {
  if (currentUser && currentOrderCode) {
    document.getElementById('orderCodeInput').value = currentOrderCode;
    showLoader('جاري استعادة الجلسة والبيانات...');
    const res = await apiCall('GET_ORDER', { orderCode: currentOrderCode });
    hideLoader();

    if (res.success) {
      currentOrderData = res;
      document.getElementById('lblWorker').textContent = currentUser;
      document.getElementById('lblCode').textContent = currentOrderCode;
      
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('scanScreen').classList.remove('hidden');
      document.getElementById('statusTag').textContent = 'جاري التحضير';
      document.getElementById('barcodeInput').focus();
    } else {
      localStorage.removeItem('branchprep_ordercode');
    }
  }
});

async function loginWorker() {
  const name = document.getElementById('workerNameInput').value.trim();
  const code = document.getElementById('orderCodeInput').value.trim();
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');

  if(!name || !code) {
    errBox.textContent = 'برجاء كتابة الاسم وكود الطلبية كاملين!';
    errBox.classList.remove('hidden');
    return;
  }

  localStorage.setItem('branchprep_worker', name);
  localStorage.setItem('branchprep_ordercode', code);
  currentUser = name;
  currentOrderCode = code;

  showLoader('جاري فتح الطلبية والسحابة...');
  const res = await apiCall('GET_ORDER', { orderCode: code });
  hideLoader();

  if(res.success) {
    currentOrderData = res;
    document.getElementById('lblWorker').textContent = currentUser;
    document.getElementById('lblCode').textContent = currentOrderCode;
    
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('scanScreen').classList.remove('hidden');
    document.getElementById('statusTag').textContent = 'جاري التحضير';
    document.getElementById('barcodeInput').focus();
  } else {
    errBox.textContent = res.message || 'كود الطلبية غير صحيح أو غير موجود!';
    errBox.classList.remove('hidden');
  }
}

function leaveOrder() {
  if(!confirm('هل تريد الخروج من هذه الطلبية؟')) return;
  if(currentScannedBarcode) {
    apiCall('UNLOCK_PRODUCT', { orderCode: currentOrderCode, barcode: currentScannedBarcode, workerName: currentUser });
  }
  
  // مسح كود الطلبية المحفوظ لمنع الدخول التلقائي مرة أخرى
  localStorage.removeItem('branchprep_ordercode');
  currentOrderCode = '';
  currentOrderData = null;
  currentScannedBarcode = null;
  
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('lockAlert').classList.add('hidden');
  document.getElementById('placeholder').classList.remove('hidden');
  
  document.getElementById('scanScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('statusTag').textContent = 'تسجيل الدخول';
}

// ==========================================
// المسح وقفل المنتج اللحظي
// ==========================================
document.getElementById('scanForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const barcode = document.getElementById('barcodeInput').value.trim();
  if(!barcode) return;
  document.getElementById('barcodeInput').value = '';
  document.getElementById('barcodeInput').focus();

  if(!currentOrderData || !currentOrderData.items[barcode]) {
    alert('المنتج ده غير مطلوب في هذه الطلبية!');
    return;
  }

  document.getElementById('placeholder').classList.add('hidden');
  const resultBox = document.getElementById('resultBox');
  const lockAlert = document.getElementById('lockAlert');
  resultBox.classList.remove('hidden');
  
  showLoader('تحديث حالة الصنف بالسحابة...');
  const syncRes = await apiCall('GET_ORDER', { orderCode: currentOrderCode });
  hideLoader();
  
  if(syncRes.success) currentOrderData = syncRes;
  
  const lockedBy = currentOrderData.locks[barcode];
  
  if(lockedBy && lockedBy !== currentUser) {
    lockAlert.classList.remove('hidden');
    document.getElementById('lockWorkerName').textContent = lockedBy;
    renderResult(barcode, true);
  } else {
    lockAlert.classList.add('hidden');
    if(currentScannedBarcode && currentScannedBarcode !== barcode) {
      apiCall('UNLOCK_PRODUCT', { orderCode: currentOrderCode, barcode: currentScannedBarcode, workerName: currentUser });
    }
    currentScannedBarcode = barcode;
    apiCall('LOCK_PRODUCT', { orderCode: currentOrderCode, barcode: barcode, workerName: currentUser });
    renderResult(barcode, false);
  }
});

function renderResult(barcode, isLocked) {
  const item = currentOrderData.items[barcode];
  const branches = item.branches || {};
  let rowsHtml = '';
  
  Object.keys(branches).forEach(branchName => {
    const bData = branches[branchName];
    const targetQty = Number(bData.target) || 0;
    const actual = bData.actual !== undefined ? bData.actual : '';
    const actualNum = Number(actual) || 0;
    const isDone = (actual !== '' && actualNum >= targetQty);
    const lastWorker = bData.worker ? `(${bData.worker})` : '';
    
    let actionCell = '';
    if(isLocked) {
      actionCell = `<td style="color:var(--warn);font-weight:bold;" colspan="2">🔒 مغلق مع المحضر (${currentOrderData.locks[barcode]})</td>`;
    } else {
      actionCell = `
        <td class="actual"><input type="number" class="actual-input sync-input" data-branch="${branchName}" data-barcode="${barcode}" value="${actual}"></td>
        <td><button class="fill-btn" data-branch="${branchName}" data-barcode="${barcode}" data-target="${targetQty}">⚡</button></td>
      `;
    }
    
    rowsHtml += `
      <tr class="${isDone ? 'branch-done' : ''}">
        <td>${branchName} <span style="font-size:0.75rem;color:var(--muted);">${lastWorker}</span></td>
        <td class="qty">${targetQty}</td>
        ${actionCell}
      </tr>
    `;
  });

  document.getElementById('resultBox').innerHTML = `
    <div class="pname">${item.product || barcode}</div>
    <table class="branch-table"><tbody>${rowsHtml}</tbody></table>
  `;

  if(!isLocked) attachSyncEvents();
}

function attachSyncEvents() {
  document.querySelectorAll('.fill-btn').forEach(btn => {
    btn.onclick = async function() {
      const branch = this.getAttribute('data-branch');
      const barcode = this.getAttribute('data-barcode');
      const target = this.getAttribute('data-target');
      
      const input = document.querySelector(`.sync-input[data-branch="${branch}"]`);
      if(input) input.value = target;
      
      this.closest('tr').classList.add('branch-done');
      
      apiCall('UPDATE_QTY', { orderCode: currentOrderCode, barcode: barcode, branch: branch, actualQty: target, workerName: currentUser });
      
      if(currentOrderData.items[barcode] && currentOrderData.items[barcode].branches[branch]) {
        currentOrderData.items[barcode].branches[branch].actual = target;
        currentOrderData.items[barcode].branches[branch].worker = currentUser;
      }
    };
  });

  document.querySelectorAll('.sync-input').forEach(input => {
    input.onchange = async function() {
      const branch = this.getAttribute('data-branch');
      const barcode = this.getAttribute('data-barcode');
      const val = this.value;
      
      const target = Number(this.closest('tr').querySelector('.qty').textContent);
      if(val !== '' && Number(val) >= target) {
        this.closest('tr').classList.add('branch-done');
      } else {
        this.closest('tr').classList.remove('branch-done');
      }
      
      apiCall('UPDATE_QTY', { orderCode: currentOrderCode, barcode: barcode, branch: branch, actualQty: val, workerName: currentUser });
      
      if(currentOrderData.items[barcode] && currentOrderData.items[barcode].branches[branch]) {
        currentOrderData.items[barcode].branches[branch].actual = val;
        currentOrderData.items[barcode].branches[branch].worker = currentUser;
      }
    };
  });
}
</script>
</body>
</html>

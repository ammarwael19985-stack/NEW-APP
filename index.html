<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BranchPrep - تحضير الفروع بالباركود</title>
<style>
  :root {
    --ink:#12181f;
    --paper:#f5f3ee;
    --panel:#ffffff;
    --line:#dcd6c9;
    --accent:#1f6f5c;
    --accent-dark:#154d40;
    --warn:#b3452b;
    --muted:#6b6459;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:0;
    background:var(--paper); color:var(--ink);
    font-family:'Tahoma','Segoe UI',sans-serif;
    min-height:100vh;
  }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 20px; border-bottom:2px solid var(--ink); margin-bottom:22px;
  }
  header h1 { font-size:1.15rem; margin:0; font-weight:800; }
  header .tag { font-size:.7rem; color:var(--muted); border:1px solid var(--line); padding:3px 8px; border-radius:20px; }
  
  .login-card {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:34px 22px; text-align:center;
  }
  .login-card input {
    width:100%; padding:14px; margin-bottom:12px; border-radius:10px;
    border:1px solid var(--line); font-size:1.1rem; text-align:center; font-weight:bold;
  }
  .login-card input:focus { outline:2px solid var(--accent); }

  .file-btn {
    display:inline-block; background:var(--accent); color:#fff;
    padding:13px 28px; border-radius:10px; font-weight:700;
    font-size:.95rem; cursor:pointer; border:none; width:100%;
  }
  .file-btn:active { background:var(--accent-dark); }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; margin-bottom:16px;
    font-size:.78rem; color:var(--muted);
  }
  .status-bar b { color:var(--ink); }
  .status-bar button {
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; font-size:.75rem; color:var(--warn); cursor:pointer;
  }

  .worker-warning {
    background:#fbeae5; border:2px solid var(--warn); color:var(--warn);
    padding:12px 14px; border-radius:10px; font-weight:bold; font-size:0.95rem;
    margin-bottom:14px; text-align:center; display:none;
    box-shadow: 0 4px 10px rgba(179,69,43,0.15);
  }

  .scan-box { background:var(--ink); border-radius:14px; padding:20px; margin-bottom:18px; }
  .scan-box label { color:#c9c2b3; font-size:.8rem; display:block; margin-bottom:8px; }
  .scan-box input {
    width:100%; padding:16px 14px; font-size:1.3rem; border-radius:10px;
    border:none; text-align:center; letter-spacing:1px; font-weight:700;
  }
  .scan-box input:focus { outline:3px solid var(--accent); }
  
  .result { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .result .pname { font-size:1.15rem; font-weight:800; margin-bottom:2px; }
  .result .pbarcode { font-size:.78rem; color:var(--muted); margin-bottom:16px; direction:ltr; display:inline-block; }
  .branch-table { width:100%; border-collapse:collapse; }
  .branch-table tr { border-bottom:1px solid var(--line); }
  .branch-table tr:last-child { border-bottom:none; }
  .branch-table td { padding:12px 4px; font-size:1rem; }
  .branch-table td.qty { text-align:left; font-weight:800; font-size:1.25rem; color:var(--accent-dark); white-space:nowrap; }
  .branch-table tr.zero td.qty { color:#b7b1a3; }
  .total-row td { font-weight:800; padding-top:14px; border-top:2px solid var(--ink); }
  .total-row td.qty { color:var(--ink); font-size:1.3rem; }
  
  .branch-table td.check { width:38px; text-align:center; padding:0 2px; }
  .fill-btn {
    background:#faf8f2; border:1px solid var(--line); border-radius:8px;
    width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem; color:var(--accent-dark); transition:all 0.15s ease;
  }
  .fill-btn:active { background:var(--accent); color:#fff; border-color:var(--accent); transform:scale(0.92); }
  
  tr.branch-done td { color:#9a9488; }
  tr.branch-done td.qty { color:#9a9488; text-decoration:line-through; }
  tr.branch-done td:first-child { text-decoration:line-through; }
  .branch-table tr[data-branch] { cursor:pointer; }
  .branch-table tr.selected td:first-child { font-weight:800; color:var(--accent-dark); }
  .branch-table tr.selected { background:#eef3ee; }
  .progress-note { font-size:.78rem; color:var(--muted); margin-bottom:14px; }
  .branch-table td.actual { width:78px; padding:6px 4px; }
  .actual-input {
    width:100%; padding:8px 4px; border:1px solid var(--line); border-radius:8px;
    text-align:center; font-size:1rem; font-weight:700; color:var(--ink); background:#faf8f2;
  }
  .actual-input:focus { outline:2px solid var(--accent); border-color:var(--accent); }

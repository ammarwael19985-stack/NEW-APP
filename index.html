<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BranchPrep Cloud</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f5c">
<style>
  :root{ --ink:#12181f; --paper:#f5f3ee; --panel:#ffffff; --line:#dcd6c9; --accent:#1f6f5c; --warn:#b3452b; --muted:#6b6459; }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Tahoma',sans-serif;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 20px;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  header h1{font-size:1.15rem;margin:0;font-weight:800;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 20px;text-align:center;}
  .btn{background:var(--accent);color:#fff;padding:14px 24px;border-radius:10px;font-weight:700;border:none;width:100%;cursor:pointer;font-size:1rem;}
  .input-group{margin-bottom:16px;text-align:right;}
  .input-group label{display:block;font-size:.85rem;margin-bottom:6px;color:var(--muted);}
  .input-group input{width:100%;padding:12px;font-size:1.1rem;border-radius:8px;border:1px solid var(--line);background:#faf8f2;}
  .hidden{display:none !important;}
  .status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.78rem;}
  .scan-box{background:var(--ink);border-radius:14px;padding:20px;margin-bottom:18px;}
  .scan-box label{color:#c9c2b3;font-size:.8rem;display:block;margin-bottom:8px;}
  .scan-box input{width:100%;padding:16px;font-size:1.3rem;border-radius:10px;border:none;text-align:center;font-weight:700;}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .pname{font-size:1.15rem;font-weight:800;margin-bottom:12px;}
  .branch-table{width:100%;border-collapse:collapse;}
  .branch-table tr{border-bottom:1px solid var(--line);}
  .branch-table td{padding:12px 4px;font-size:1rem;}
  .branch-table td.qty{text-align:left;font-weight:800;font-size:1.25rem;color:var(--accent);}
  .actual-input{width:60px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:1rem;font-weight:700;}
  .fill-btn{background:#faf8f2;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1rem;}
  tr.branch-done td{color:#9a9488;}
  tr.branch-done td.qty{text-decoration:line-through;}
  .lock-banner{background:#fbeae5;border:2px solid var(--warn);color:var(--warn);padding:14px;border-radius:12px;font-size:.95rem;font-weight:bold;text-align:center;margin-bottom:16px;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>BranchPrep Cloud ☁️</h1>
    <span style="font-size:.75rem;color:var(--muted);" id="statusTag">تسجيل الدخول</span>
  </header>

  <!-- دخول العامل -->
  <div id="loginScreen" class="card">
    <div style="font-size:3rem;margin-bottom:10px;">👷‍♂️</div>
    <h2>دخول عمال التحضير</h2>
    <div class="input-group">
      <label>اسم العامل:</label>
      <input type="text" id="workerNameInput" placeholder="مثال: عمار" />
    </div>
    <div class="input-group">
      <label>كود الطلبية (4 أرقام):</label>
      <input type="number" id="orderCodeInput" placeholder="مثال: 7822" inputmode="numeric" />
    </div>
    <button class="btn" onclick="loginWorker()">دخول لبدء التحضير 🚀</button>
  </div>

  <!-- شاشة العمل -->
  <div id="scanScreen" class="hidden">
    <div class="status-bar">
      <span>المحضر: <b id="lblWorker"></b> | الطلبية: <b id="lblCode"></b></span>
      <button onclick="leaveOrder()" style="background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--warn);">خروج</button>
    </div>

    <div class="scan-box">
      <label>امسح باركود المنتج الآن</label>
      <form id="scanForm">
        <input type="text" id="barcodeInput" placeholder="اضرب الباركود هنا" autocomplete="off" />
      </form>
    </div>

    <div id="lockAlert" class="lock-banner hidden">
      🛑 الصنف مغلق حالياً مع المحضر: <span id="lockWorkerName"></span>
    </div>

    <div id="resultBox" class="result hidden"></div>
    <div id="placeholder" style="text-align:center;color:var(--muted);padding:30px 20px;">امسح باركود أي صنف لعرض المطلوبات</div>
  </div>
</div>

<script>
const DB_URL = "https://branchprep-default-rtdb.firebaseio.com";

let currentUser = localStorage.getItem('bp_worker') || '';
let currentOrderCode = localStorage.getItem('bp_code') || '';
let currentOrderData = null;
let currentScannedBarcode = null;

if(currentUser) document.getElementById('workerNameInput').value = currentUser;

window.addEventListener('DOMContentLoaded', () => {
  if (currentUser && currentOrderCode) loginWorker(true);
});

async function loginWorker(auto = false) {
  if(!auto) {
    currentUser = document.getElementById('workerNameInput').value.trim();
    currentOrderCode = document.getElementById('orderCodeInput').value.trim();
  }
  
  if(!currentUser || !currentOrderCode) return alert('أدخل البيانات كاملة!');

  const res = await fetch(`${DB_URL}/orders/${currentOrderCode}.json`);
  const data = await res.json();

  if(data && data.items) {
    currentOrderData = data;
    localStorage.setItem('bp_worker', currentUser);
    localStorage.setItem('bp_code', currentOrderCode);

    document.getElementById('lblWorker').textContent = currentUser;
    document.getElementById('lblCode').textContent = currentOrderCode;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('scanScreen').classList.remove('hidden');
    document.getElementById('barcodeInput').focus();
    
    listenToRealtime();
  } else {
    alert('كود الطلبية غير صحيح!');
    localStorage.removeItem('bp_code');
  }
}

function listenToRealtime() {
  const source = new EventSource(`${DB_URL}/orders/${currentOrderCode}.json`);
  source.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if(data) {
      currentOrderData = data;
      if(currentScannedBarcode) renderResult(currentScannedBarcode);
    }
  };
}

document.getElementById('scanForm').addEventListener('submit', function(e){
  e.preventDefault();
  const barcode = document.getElementById('barcodeInput').value.trim();
  if(!barcode) return;
  document.getElementById('barcodeInput').value = '';
  document.getElementById('barcodeInput').focus();

  if(!currentOrderData.items || !currentOrderData.items[barcode]) {
    alert('المنتج غير مطلوب في هذه الطلبية!');
    return;
  }

  currentScannedBarcode = barcode;
  
  fetch(`${DB_URL}/orders/${currentOrderCode}/locks/${barcode}.json`, {
    method: 'PUT',
    body: JSON.stringify(currentUser)
  });

  renderResult(barcode);
});

function renderResult(barcode) {
  document.getElementById('placeholder').classList.add('hidden');
  const resultBox = document.getElementById('resultBox');
  const lockAlert = document.getElementById('lockAlert');
  resultBox.classList.remove('hidden');

  const item = currentOrderData.items[barcode];
  const lockWorker = currentOrderData.locks ? currentOrderData.locks[barcode] : null;

  if(lockWorker && lockWorker !== currentUser) {
    lockAlert.classList.remove('hidden');
    document.getElementById('lockWorkerName').textContent = lockWorker;
  } else {
    lockAlert.classList.add('hidden');
  }

  let rowsHtml = '';
  const branches = item.branches || {};

  Object.keys(branches).forEach(bName => {
    const bData = branches[bName];
    const target = bData.target || 0;
    const actual = bData.actual !== undefined ? bData.actual : '';
    const isDone = (actual !== '' && Number(actual) >= target);

    rowsHtml += `
      <tr class="${isDone ? 'branch-done' : ''}">
        <td>${bName} <span style="font-size:0.75rem;color:var(--muted);">${bData.worker ? '('+bData.worker+')' : ''}</span></td>
        <td class="qty">${target}</td>
        <td><input type="number" class="actual-input" value="${actual}" onchange="updateQty('${barcode}', '${bName}', this.value)" ${lockWorker && lockWorker !== currentUser ? 'disabled' : ''}></td>
        <td><button class="fill-btn" onclick="updateQty('${barcode}', '${bName}', ${target})" ${lockWorker && lockWorker !== currentUser ? 'disabled' : ''}>⚡</button></td>
      </tr>
    `;
  });

  resultBox.innerHTML = `
    <div class="pname">${item.product || barcode}</div>
    <table class="branch-table"><tbody>${rowsHtml}</tbody></table>
  `;
}

function updateQty(barcode, branch, qty) {
  fetch(`${DB_URL}/orders/${currentOrderCode}/items/${barcode}/branches/${branch}.json`, {
    method: 'PATCH',
    body: JSON.stringify({ actual: qty, worker: currentUser })
  });
}

function leaveOrder() {
  if(!confirm('خروج من الطلبية؟')) return;
  localStorage.removeItem('bp_code');
  location.reload();
}
</script>
</body>
</html>
